name: Daily News Digest

on:
  # Runs hourly. Each run delivers to users whose current local hour is at or
  # past their delivery_hour and who have no digest yet for their local date,
  # so every user is served at their own local time (and correctly across DST).
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      user:
        description: "Force delivery for a single profile uuid (optional)"
        type: string
        required: false
      preview:
        description: "With a user uuid: generate + evaluate + trace, but save and send nothing"
        type: boolean
        required: false
        default: false
      check_tracing:
        description: "Only send a test trace to Phoenix (delivers nothing)"
        type: boolean
        required: false
        default: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-worker.txt

      - name: Run digest worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # Base URL of the PWA. Adds a "how was this brief?" link to the email
          # footer; the link is omitted entirely when this is unset.
          APP_URL: ${{ vars.APP_URL }}
          # Phoenix tracing + eval results. Endpoint = the Phoenix Cloud URL
          # (https://app.phoenix.arize.com/s/<your-space>). Tracing stays off
          # when unset; evals still run and print to the log.
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
          PHOENIX_API_KEY: ${{ secrets.PHOENIX_API_KEY }}
          # Set to "off" to skip the LLM judge (one extra Gemini call per brief).
          MYNEWS_LLM_EVALS: ${{ vars.MYNEWS_LLM_EVALS }}
        run: |
          if [ "${{ inputs.check_tracing }}" = "true" ]; then
            python -m news_bot.tracing --check
          elif [ -n "${{ inputs.user }}" ] && [ "${{ inputs.preview }}" = "true" ]; then
            python -m news_bot.main --user "${{ inputs.user }}" --preview
          elif [ -n "${{ inputs.user }}" ]; then
            python -m news_bot.main --user "${{ inputs.user }}"
          else
            python -m news_bot.main
          fi
